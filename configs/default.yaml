seed: 42

data:
  raw_root: data/raw
  annotation_csv: data/raw/train.csv

  protocol_id: vindr_s8515_exttest_v1
  protocol_dir: data/protocols/vindr_s8515_exttest_v1
  validation_ids_path: data/protocols/vindr_s8515_exttest_v1/validation_ids.csv
  train_manifest_path: data/protocols/vindr_s8515_exttest_v1/train_manifest.csv
  val_manifest_path: data/protocols/vindr_s8515_exttest_v1/val_manifest.csv

  manifest_path: data/processed/manifest.csv
  consensus_boxes_path: data/processed/consensus_boxes.csv
  metadata_path: data/processed/metadata.json

  processed_root: data/processed/consensus_v1_224

  external_test:
    annotation_csv: data/raw/test.csv
    image_dir: data/raw/test
    processed_root: data/processed/consensus_test_v1_224
    manifest_path: data/protocols/vindr_s8515_exttest_v1/external_test_manifest.csv
    reader_id: consensus

  target_findings:
    - Aortic enlargement
    - Atelectasis
    - Calcification
    - Cardiomegaly
    - Consolidation
    - ILD
    - Infiltration
    - Lung Opacity
    - Nodule/Mass
    - Other lesion
    - Pleural effusion
    - Pleural thickening
    - Pneumothorax
    - Pulmonary fibrosis

  expected_readers: 3
  positive_votes: 2
  minority_policy: negative

  train_fraction: 0.85
  val_fraction: 0.15

preprocessing:
  image_size: 224

  image_resize_mode: bilinear
  soft_mask_resize_mode: area

  grayscale_to_rgb: true

  mean:
    - 0.485
    - 0.456
    - 0.406

  std:
    - 0.229
    - 0.224
    - 0.225

  use_augmentation: false
  augmentation:
    rotation_degrees: 7.0
    translate_fraction: 0.03
    scale:
      - 0.95
      - 1.05
    intensity_probability: 0.5
    brightness: 0.10
    contrast: 0.10
  use_clahe: false

model:
  name: resnet50
  pretrained: true
  # Chỉ ResNet-50: layer4 dùng dilation thay vì stride -> CAM 14x14 thay vì 7x7.
  dilate_last_stage: false

training:
  batch_size: 8
  validation_batch_size: 8
  num_workers: 2
  persistent_workers: true
  prefetch_factor: 2
  use_amp: true
  show_progress: true

  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001

  monitor: macro_auroc
  patience: 5
  min_delta: 0.0001

  # Khởi tạo bias head = log(p_eff/(1-p_eff)) theo tỉ lệ dương train và pos_weight.
  prior_bias_init: false

  loss:
    # weighted_bce | sigmoid_focal (thêm gamma) | asymmetric (gamma_pos, gamma_neg, clip;
    # mặc định 0 / 4 / 0.05 theo Ridnik et al. 2021, thường dùng với positive_weight.mode: none)
    name: weighted_bce
    positive_weight:
      # raw_ratio | sqrt_ratio | sqrt_ratio_capped (max_value) | class_balanced (beta) | none
      mode: raw_ratio
      max_value: null
    # Nhãn khi TRAIN: majority (mặc định) | ignore_minority (bỏ ca 1/3 reader)
    # | soft_votes (target = số reader / 3). Validation/test luôn dùng nhãn đa số.
    label_policy: majority

localization_loss:
  enabled: false
  lambda_loc: 0.25
  # Vùng đích của L_loc: union (>=1 reader, mặc định), majority (>=2/3 reader),
  # soft (tỉ lệ reader vẽ box, dùng làm trọng số).
  mask: union
  # Biến CAM thành năng lượng không âm: softplus (mặc định) hoặc relu (như Rao et al. 2023).
  activation: softplus
