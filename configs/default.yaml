seed: 42

data:
  raw_root: data/raw
  annotation_csv: data/raw/train.csv

  protocol_id: vindr_s8515_exttest_v1
  protocol_dir: data/protocols/vindr_s8515_exttest_v1
  validation_ids_path: data/protocols/vindr_s8515_exttest_v1/validation_ids.csv
  train_manifest_path: data/protocols/vindr_s8515_exttest_v1/train_manifest.csv
  val_manifest_path: data/protocols/vindr_s8515_exttest_v1/val_manifest.csv

  manifest_path: data/processed/manifest.csv
  consensus_boxes_path: data/processed/consensus_boxes.csv
  metadata_path: data/processed/metadata.json

  processed_root: data/processed/consensus_v1_224

  external_test:
    annotation_csv: data/raw/test.csv
    image_dir: data/raw/test
    processed_root: data/processed/consensus_test_v1_224
    manifest_path: data/protocols/vindr_s8515_exttest_v1/external_test_manifest.csv
    reader_id: consensus

  target_findings:
    - Aortic enlargement
    - Atelectasis
    - Calcification
    - Cardiomegaly
    - Consolidation
    - ILD
    - Infiltration
    - Lung Opacity
    - Nodule/Mass
    - Other lesion
    - Pleural effusion
    - Pleural thickening
    - Pneumothorax
    - Pulmonary fibrosis

  expected_readers: 3
  positive_votes: 2
  minority_policy: negative

  train_fraction: 0.85
  val_fraction: 0.15

preprocessing:
  image_size: 224

  image_resize_mode: bilinear
  soft_mask_resize_mode: area

  grayscale_to_rgb: true

  mean:
    - 0.485
    - 0.456
    - 0.406

  std:
    - 0.229
    - 0.224
    - 0.225

  use_augmentation: false
  use_clahe: false

model:
  name: resnet50
  pretrained: true

training:
  batch_size: 8
  num_workers: 2
  persistent_workers: true
  prefetch_factor: 2
  use_amp: true
  show_progress: true

  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001

  monitor: macro_auroc
  patience: 5
  min_delta: 0.0001
